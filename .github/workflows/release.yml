name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # macOS 26 runner: the app must link against the macOS 26 SDK or the OS
    # renders it with legacy (pre-Tahoe) window chrome.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode (need macOS 26 SDK)
        run: |
          best=""; bestv=0
          for x in /Applications/Xcode*.app; do
            v=$(DEVELOPER_DIR="$x" xcrun --sdk macosx --show-sdk-version 2>/dev/null | cut -d. -f1)
            echo "$x -> SDK ${v:-?}"
            if [[ -n "$v" && "$v" -gt "$bestv" ]]; then bestv=$v; best=$x; fi
          done
          echo "Selected: $best (SDK major $bestv)"
          sudo xcode-select -s "$best"
          sdk=$(xcrun --sdk macosx --show-sdk-version)
          echo "Active SDK: $sdk"
          if [[ "${sdk%%.*}" -lt 26 ]]; then
            echo "::error::macOS 26 SDK required, got $sdk — app would render with legacy chrome"
            exit 1
          fi

      - name: Build release artifacts
        run: ./release.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OnkyoMac.dmg
            dist/OnkyoMac.zip
          body_path: RELEASE_NOTES.md
